[project]
name = "scrubber"
version = "0.2.0"
description = "LLM-planned, deterministic data cleaning for CSV, SQL and MongoDB"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",  # PostgreSQL
    "pymysql>=1.1",  # MySQL / MariaDB
    "pymongo>=4.6",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mongomock>=4.1", "httpx>=0.27"]

[project.scripts]
scrubber = "scrubber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrubber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
